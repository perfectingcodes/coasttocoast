# Static deploy. The build runs the full pipeline — client bundle, SSR bundle,
# then the prerender step that writes 92 HTML pages plus sitemap.xml,
# robots.txt, llms.txt and 404.html.
[build]
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"

# Every route is a real prerendered file, so there is no SPA fallback here on
# purpose: a URL that does not exist should 404, not quietly serve the home
# page and dilute the index.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
